// ============================================================
// APP STATE
// ============================================================

let mode = "all";
let navOpen = false;
let copied = false;
let formData = { name: "", email: "", subject: "", message: "" };

function setMode(key) {
  mode = key;
  navOpen = false;
  window.location.hash = key === "all" ? "" : key;
  render();
}

function toggleNav() {
  navOpen = !navOpen;
  render();
}

function copyLink() {
  const base = window.location.href.split("#")[0];
  const url = mode === "all" ? base : base + "#" + mode;
  navigator.clipboard.writeText(url).then(() => {
    copied = true;
    render();
    setTimeout(() => { copied = false; render(); }, 1800);
  });
}

function updateForm(key, value) {
  formData[key] = value;
}

function getMailto() {
  const body = `${formData.message}\n\n— ${formData.name}\n${formData.email}`;
  return `mailto:${PROFILE.email}?subject=${encodeURIComponent(formData.subject || "Website inquiry")}&body=${encodeURIComponent(body)}`;
}

// ============================================================
// UTILITIES
// ============================================================

function inMode(item, m) {
  return m === "all" || item.modes.includes(m);
}

function daysUntil(iso) {
  return Math.round((new Date(iso + "T00:00:00") - new Date()) / 86400000);
}

function fmtDate(iso) {
  return new Date(iso + "T00:00:00").toLocaleDateString("en-US", { year: "numeric", month: "short", day: "2-digit" });
}

function certStatus(iso) {
  const d = daysUntil(iso);
  if (d < 0) return { key: "expired", label: "Expired", days: d, tone: "text-red-400", dot: "bg-red-500" };
  if (d <= 90) return { key: "soon", label: "Renew soon", days: d, tone: "text-amber-300", dot: "bg-amber-400" };
  return { key: "current", label: "Current", days: d, tone: "text-emerald-400", dot: "bg-emerald-500" };
}

// ============================================================
// RENDER
// ============================================================

function render() {

  const status = PROFILE.status[mode];
  
  const certs = CERTIFICATIONS.filter(c => inMode(c, mode)).sort((a, b) => new Date(a.expires) - new Date(b.expires));

  const shots = PORTFOLIO.filter(p => inMode(p, mode));
  const services = SERVICES.filter(s => inMode(s, mode));
  const quotes = TESTIMONIALS.filter(q => inMode(q, mode));
  const resumes = PROFILE.resumes.filter(r => inMode(r, mode));
  const flagged = certs.filter(c => certStatus(c.expires).key !== "current").length;

          <a href="#experience" class="font-mono text-xs uppercase tracking-widest text-zinc-500 hover:text-zinc-100 transition">Experience</a>
          <a href="#field-work" class="font-mono text-xs uppercase tracking-widest text-zinc-500 hover:text-zinc-100 transition">Field work</a>
          <a href="#contact" class="font-mono text-xs uppercase tracking-widest text-zinc-500 hover:text-zinc-100 transition">Contact</a>
        </nav>
        <button onclick="toggleNav()" class="text-zinc-300 md:hidden text-xl">
          ${navOpen ? '✕' : '☰'}
        </button>
      </div>

      <!-- Mode filter -->
      <div class="border-t ${t.rule}">
        <div class="mx-auto flex max-w-5xl items-center gap-2 overflow-x-auto px-5 py-2 sm:px-8">

            const on = mode === m.key;

              <button
                onclick="setMode('${m.key}')"
                class="flex shrink-0 items-center gap-1 rounded-full px-3 py-1.5 font-mono text-xs uppercase tracking-widest transition whitespace-nowrap ${
                  on ? t.chipOn : "text-zinc-500 hover:text-zinc-200"
                }"
              >
                ${m.icon}
                ${m.label}
              </button>
            `;
          }).join('')}

            onclick="copyLink()"

        </div>

    <!-- Hero -->
    <section id="top" class="px-5 pb-16 pt-14 sm:px-8 md:pb-24 md:pt-20">

          <div class="inline-flex items-center gap-2 border ${t.edge} px-3 py-1">

    ${quotes.length > 0 ? `

                <p class="font-serif text-lg leading-relaxed text-zinc-200">"${q.quote}"</p>
                <footer class="mt-4">

    ` : ''}

    <!-- Contact -->
    <section id="contact" class="border-t ${t.rule} px-5 py-16 sm:px-8 md:py-24">
      <div class="mx-auto max-w-5xl">
        <div class="mb-10">
          <p class="font-mono text-xs uppercase tracking-widest ${t.text}">Get in touch</p>
          <h2 class="mt-2 font-serif text-3xl text-zinc-100 md:text-4xl">Contact</h2>
        </div>
        <div class="grid gap-10 md:grid-cols-2">
          <div class="space-y-5">
            <div class="flex gap-4">
              <span class="text-lg">✉️</span>
              <div>
                <p class="font-mono text-xs uppercase tracking-widest ${t.dim}">Email</p>
                <a href="mailto:${PROFILE.email}" class="text-zinc-100 hover:underline">${PROFILE.email}</a>
              </div>
            </div>
            <div class="flex gap-4">
              <span class="text-lg">📞</span>
              <div>
                <p class="font-mono text-xs uppercase tracking-widest ${t.dim}">Phone</p>
                <a href="tel:${PROFILE.phone.replace(/\D/g, '')}" class="text-zinc-100 hover:underline">${PROFILE.phone}</a>
              </div>
            </div>
            <div class="flex gap-4">
              <span class="text-lg">📍</span>
              <div>
                <p class="font-mono text-xs uppercase tracking-widest ${t.dim}">Location</p>
                <p class="text-zinc-100">${PROFILE.location}</p>
              </div>
            </div>
            ${PROFILE.resumes.length > 0 ? `
              <div class="border-t ${t.rule} pt-5">
                <p class="font-mono text-xs uppercase tracking-widest ${t.dim} mb-3">Documents</p>
                <div class="space-y-2">
                  ${PROFILE.resumes.map(r => `
                    <a href="${r.href}" class="flex items-center gap-2 text-sm text-zinc-300 hover:text-zinc-100">
                      📄 ${r.label}
                    </a>
                  `).join('')}
                </div>
              </div>
            ` : ''}
          </div>

          <div class="border ${t.rule} p-6 rounded">
            <div class="space-y-4">
              <div>
                <label class="font-mono text-xs uppercase tracking-widest ${t.dim} mb-1.5 block">Name</label>
                <input type="text" id="fname" class="w-full border ${t.rule} bg-black bg-opacity-30 px-3 py-2 text-sm text-zinc-100 outline-none focus:border-zinc-400 rounded">
              </div>
              <div>
                <label class="font-mono text-xs uppercase tracking-widest ${t.dim} mb-1.5 block">Email</label>
                <input type="email" id="femail" class="w-full border ${t.rule} bg-black bg-opacity-30 px-3 py-2 text-sm text-zinc-100 outline-none focus:border-zinc-400 rounded">
              </div>
              <div>
                <label class="font-mono text-xs uppercase tracking-widest ${t.dim} mb-1.5 block">Subject</label>
                <input type="text" id="fsubject" class="w-full border ${t.rule} bg-black bg-opacity-30 px-3 py-2 text-sm text-zinc-100 outline-none focus:border-zinc-400 rounded">
              </div>
              <div>
                <label class="font-mono text-xs uppercase tracking-widest ${t.dim} mb-1.5 block">Message</label>
                <textarea rows="4" id="fmessage" class="w-full border ${t.rule} bg-black bg-opacity-30 px-3 py-2 text-sm text-zinc-100 outline-none focus:border-zinc-400 rounded"></textarea>
              </div>
              <a href="javascript:void(0)" onclick="submitForm()" class="${t.chipOn} block px-5 py-3 text-center font-mono text-xs uppercase tracking-widest rounded">Send message</a>
              <p class="font-mono text-xs ${t.dim}">Opens your mail app with the message ready to send.</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="border-t ${t.rule} px-5 py-10 sm:px-8">
      <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-6">
        <div>
          <p class="font-serif text-lg text-zinc-100">${PROFILE.name}</p>
          <p class="font-mono text-xs ${t.dim}">${PROFILE.roleLine.all}</p>
        </div>
        <div class="flex gap-4 text-lg">
          ${PROFILE.socials.map(s => `
            <a href="${s.url}" target="_blank" rel="noopener noreferrer" class="opacity-60 hover:opacity-100 transition">
              ${s.icon}
            </a>
          `).join('')}
        </div>
      </div>
    </footer>
  `;

  document.getElementById('app').innerHTML = html;
  document.body.className = t.shell + " text-zinc-300";
}

function submitForm() {
  const name = document.getElementById('fname')?.value || '';
  const email = document.getElementById('femail')?.value || '';
  const subject = document.getElementById('fsubject')?.value || 'Website inquiry';
  const message = document.getElementById('fmessage')?.value || '';
  
  const body = `${message}\n\n— ${name}\n${email}`;
  const href = `mailto:${PROFILE.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  window.location.href = href;
}

// ============================================================
// INIT
// ============================================================

window.addEventListener('hashchange', () => {
  const h = window.location.hash.replace("#", "");
  if (MODES.some(m => m.key === h)) mode = h;
  else mode = "all";
  render();
});

document.addEventListener('DOMContentLoaded', () => {
  const h = window.location.hash.replace("#", "");
  if (MODES.some(m => m.key === h)) mode = h;
  render();
});

// Fallback init
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => { if (!window.initialized) { render(); window.initialized = true; } });
} else {
  render();
  window.initialized = true;
}
</script>

</body>
</html>
